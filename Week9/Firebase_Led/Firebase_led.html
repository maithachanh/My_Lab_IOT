<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Điều khiển LED bằng giọng nói</title>
  <script type='module'>
    // init firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, child, onValue, set } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
    
    // SỬA LỖI 1: Thêm https:// vào databaseURL
    const config = { databaseURL: 'https://rgbleddemo-default-rtdb.asia-southeast1.firebasedatabase.app' };
    initializeApp(config);
    const dbRef = ref(getDatabase());

    // event-handler methods
    window.page_Load = function page_Load() {
      listenFirebase();
      initSpeechRecognition();
    }

    // helper methods
    function listenFirebase() {
      onValue(child(dbRef, 'LEDs'), (snapshot) => {
        snapshot.forEach((childNode) => {
          if (childNode.key === 'R') document.getElementById('lblRed').innerText = childNode.val();
          if (childNode.key === 'G') document.getElementById('lblGreen').innerText = childNode.val();
          if (childNode.key === 'B') document.getElementById('lblBlue').innerText = childNode.val();
        });
      });
    }

    function initSpeechRecognition() {
      const btnStart = document.getElementById('btnStart');
      const lblCommand = document.getElementById('lblCommand');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      // Cảnh báo nếu trình duyệt không hỗ trợ Web Speech API
      if (!SpeechRecognition) {
        alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng dùng Google Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN'; // 'en-US'
      recognition.interimResults = true;
      recognition.continuous = false;

      btnStart.addEventListener('click', () => {
        recognition.start();
        btnStart.disabled = true;
        btnStart.textContent = 'Đang nghe ........';
        lblCommand.textContent = '';
      });

      recognition.onresult = (event) => {
        const result = event.results[event.results.length - 1][0].transcript;
        lblCommand.textContent = result;
      };

      recognition.onend = () => {
        btnStart.disabled = false;
        btnStart.textContent = 'Voice command';
        parseCommand(lblCommand.textContent.toLowerCase());
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        // Bật lại nút nếu có lỗi xảy ra
        btnStart.disabled = false;
        btnStart.textContent = 'Voice command';
      };

      recognition.onnomatch = () => {
        console.log('No speech was recognized.');
      };
    }

    function parseCommand(cmd) {
      // SỬA LỖI 2: Thêm fallback '|| 0' để tránh lỗi NaN khi UI chưa load xong dữ liệu
      const currentR = parseInt(document.getElementById('lblRed').innerText) || 0;
      const currentG = parseInt(document.getElementById('lblGreen').innerText) || 0;
      const currentB = parseInt(document.getElementById('lblBlue').innerText) || 0;

      if (cmd.includes('đèn') && cmd.includes('đỏ')) {
        let r = 0;
        if (cmd.includes('bật') || cmd.includes('mở')) r = 255;
        else if (cmd.includes('tắt')) r = 0;
        set(child(dbRef, 'LEDs'), { R: r, G: currentG, B: currentB });

      } else if (cmd.includes('đèn') && cmd.includes('xanh lá')) {
        let g = 0;
        if (cmd.includes('bật') || cmd.includes('mở')) g = 255;
        else if (cmd.includes('tắt')) g = 0;
        set(child(dbRef, 'LEDs'), { R: currentR, G: g, B: currentB });

      } else if (cmd.includes('đèn') && cmd.includes('xanh dương')) {
        let b = 0;
        if (cmd.includes('bật') || cmd.includes('mở')) b = 255;
        else if (cmd.includes('tắt')) b = 0;
        set(child(dbRef, 'LEDs'), { R: currentR, G: currentG, B: b });
      }
    }
  </script>
</head>

<body onload='page_Load()'>
  <table cellspacing='10'>
    <tr>
      <td colspan='2'><strong>LEDs Status</strong></td>
    </tr>
    <tr>
      <td>+ Red:</td>
      <td><span id='lblRed'></span></td>
    </tr>
    <tr>
      <td>+ Green:</td>
      <td><span id='lblGreen'></span></td>
    </tr>
    <tr>
      <td>+ Blue:</td>
      <td><span id='lblBlue'></span></td>
    </tr>
    <tr>
      <td><button id='btnStart'>Voice command</button></td>
      <td><span id='lblCommand'></span></td>
    </tr>
  </table>
</body>

</html>
